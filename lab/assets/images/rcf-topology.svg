<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" style="max-width:100%;height:auto" role="group" aria-labelledby="rcf-topology-title rcf-topology-desc">
  <title id="rcf-topology-title">RCF Sandbox topology</title>
  <desc id="rcf-topology-desc">Six EOS devices and seven links from topology.clab.yml. Select a device to open its SSH terminal as admin.</desc>
  <style>
    .rcf-edge { stroke: var(--bs-secondary-color, #6c757d); stroke-width: 2; fill: none; }
    .rcf-port { fill: var(--bs-body-color, #212529); font: 13px monospace; text-anchor: middle; }
    .rcf-device rect { fill: var(--bs-tertiary-bg, #e9ecef); stroke: var(--bs-primary, #0d6efd); stroke-width: 2; }
    .rcf-device text { fill: var(--bs-body-color, #212529); text-anchor: middle; font-family: monospace; }
    .rcf-device:hover rect, .rcf-device:focus rect { stroke: var(--bs-body-color, #212529); stroke-width: 3; }
  </style>
  <g data-endpoints="EOS1:et1 EOS2:et1">
